name: Compila Noctis Magic

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: noctis-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepara convertitore audio
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Prepara voce italiana
        run: |
          if ! command -v espeak-ng >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y espeak-ng
          fi
      - name: Estrai progetto
        run: |
          unzip -t 'NoctisMagic-0.2.0-progetto-compilazione(1).zip'
          unzip -q 'NoctisMagic-0.2.0-progetto-compilazione(1).zip' -d progetto
          wrapper=$(find progetto -name gradlew -type f -print -quit)
          test -n "$wrapper"
          echo "PROJECT_DIR=$(dirname "$wrapper")" >> "$GITHUB_ENV"
          python3 upgrade_030.py "$(dirname "$wrapper")"
          python3 upgrade_040.py "$(dirname "$wrapper")"
          python3 upgrade_050.py "$(dirname "$wrapper")"
          python3 upgrade_060.py "$(dirname "$wrapper")"
          python3 upgrade_070.py "$(dirname "$wrapper")"
          python3 upgrade_080.py "$(dirname "$wrapper")"
          python3 upgrade_082.py "$(dirname "$wrapper")"
          python3 upgrade_090.py "$(dirname "$wrapper")"
          python3 upgrade_091.py "$(dirname "$wrapper")"
          python3 upgrade_092.py "$(dirname "$wrapper")"
          python3 upgrade_093.py "$(dirname "$wrapper")"
          python3 upgrade_094.py "$(dirname "$wrapper")"
          python3 upgrade_095.py "$(dirname "$wrapper")"
          python3 upgrade_095_papi.py "$(dirname "$wrapper")"
          python3 upgrade_096.py "$(dirname "$wrapper")"
          python3 upgrade_097.py "$(dirname "$wrapper")"
          python3 upgrade_098.py "$(dirname "$wrapper")"
          python3 upgrade_099.py "$(dirname "$wrapper")"
          python3 upgrade_100.py "$(dirname "$wrapper")"
          python3 upgrade_101.py "$(dirname "$wrapper")"
          python3 upgrade_102.py "$(dirname "$wrapper")"
          python3 upgrade_103.py "$(dirname "$wrapper")"
          python3 upgrade_104.py "$(dirname "$wrapper")"
          python3 upgrade_105.py "$(dirname "$wrapper")"
          python3 upgrade_106.py "$(dirname "$wrapper")"
          python3 upgrade_107.py "$(dirname "$wrapper")"
          python3 upgrade_108.py "$(dirname "$wrapper")"
          python3 upgrade_109.py "$(dirname "$wrapper")"
          python3 upgrade_110.py "$(dirname "$wrapper")"
          python3 upgrade_111.py "$(dirname "$wrapper")"
          python3 upgrade_112.py "$(dirname "$wrapper")"
          python3 upgrade_113.py "$(dirname "$wrapper")"
          python3 upgrade_114.py "$(dirname "$wrapper")"
          python3 upgrade_115.py "$(dirname "$wrapper")"
          python3 upgrade_116.py "$(dirname "$wrapper")"
          python3 upgrade_117.py "$(dirname "$wrapper")"
          python3 upgrade_118.py "$(dirname "$wrapper")"
          python3 upgrade_119.py "$(dirname "$wrapper")"
          python3 upgrade_120.py "$(dirname "$wrapper")"
          python3 upgrade_121.py "$(dirname "$wrapper")"
          python3 upgrade_122.py "$(dirname "$wrapper")"
          python3 upgrade_123.py "$(dirname "$wrapper")"
          python3 upgrade_124.py "$(dirname "$wrapper")"
          python3 upgrade_126.py "$(dirname "$wrapper")"
          python3 upgrade_127.py "$(dirname "$wrapper")"
          python3 upgrade_128.py "$(dirname "$wrapper")"
          python3 upgrade_129.py "$(dirname "$wrapper")"
          python3 upgrade_130.py "$(dirname "$wrapper")"
          python3 upgrade_131.py "$(dirname "$wrapper")"
          python3 upgrade_132.py "$(dirname "$wrapper")"
          python3 upgrade_133.py "$(dirname "$wrapper")"
          python3 upgrade_134.py "$(dirname "$wrapper")"
          python3 upgrade_135.py "$(dirname "$wrapper")"
          python3 upgrade_136.py "$(dirname "$wrapper")"
          python3 upgrade_137.py "$(dirname "$wrapper")"
          python3 upgrade_138.py "$(dirname "$wrapper")"
          python3 upgrade_139.py "$(dirname "$wrapper")"
          python3 upgrade_140.py "$(dirname "$wrapper")"
          python3 upgrade_141.py "$(dirname "$wrapper")"
          python3 upgrade_142.py "$(dirname "$wrapper")"
          python3 upgrade_143.py "$(dirname "$wrapper")"
          python3 upgrade_144.py "$(dirname "$wrapper")"
          python3 upgrade_145.py "$(dirname "$wrapper")"
          python3 upgrade_146.py "$(dirname "$wrapper")"
          python3 upgrade_147.py "$(dirname "$wrapper")"
          python3 upgrade_148.py "$(dirname "$wrapper")"
          python3 upgrade_149.py "$(dirname "$wrapper")"
          python3 upgrade_150.py "$(dirname "$wrapper")"
      - name: Integra musica del boss
        run: |
          audio='One_-_Winged Angel (Final Fantasy VII) - Arnie Roth.mp3'
          target="$PROJECT_DIR/src/main/resources/assets/noctismagic/sounds/fallen_angel_theme.ogg"
          test -s "$audio"
          ffmpeg -nostdin -loglevel error -y -i "$audio" -map 0:a:0 -vn -c:a libvorbis -q:a 5 "$target"
          test -s "$target"
          ffprobe -v error -show_entries stream=codec_name:format=duration -of default=noprint_wrappers=1 "$target"
          sed -i 's/^mod_version=0\.8\.0$/mod_version=1.5.0/' "$PROJECT_DIR/gradle.properties"
      - name: Compila Forge
        run: |
          cd "$PROJECT_DIR"
          bash gradlew --no-daemon build --stacktrace
      - name: Verifica musica nel JAR
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          root=pathlib.Path(os.environ["PROJECT_DIR"])
          target="assets/noctismagic/sounds/fallen_angel_theme.ogg"
          source=(root/"src/main/resources"/target).read_bytes()
          jars=list((root/"build/libs").glob("*.jar"))
          assert jars, "Nessun JAR generato"
          assert any(target in z.namelist() and z.read(target)==source for p in jars for z in [zipfile.ZipFile(p)]), "Musica assente dal JAR"
          print("Musica del boss verificata nel JAR")
          PY
      - name: Carica JAR
        uses: actions/upload-artifact@v4
        with:
          name: NoctisMagic-1.5.0
          path: progetto/**/build/libs/*.jar
          if-no-files-found: error
