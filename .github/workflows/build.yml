      - name: Integra musica del boss
        run: |
          audio='One_-_Winged Angel (Final Fantasy VII) - Arnie Roth.mp3'
          target="$PROJECT_DIR/src/main/resources/assets/noctismagic/sounds/fallen_angel_theme.ogg"
          test -s "$audio"
          ffmpeg -nostdin -loglevel error -y -i "$audio" -map 0:a:0 -vn -c:a libvorbis -q:a 5 "$target"
          test -s "$target"
          ffprobe -v error -show_entries stream=codec_name:format=duration -of default=noprint_wrappers=1 "$target"
          sed -i 's/^mod_version=0\.8\.0$/mod_version=1.7.48/' "$PROJECT_DIR/gradle.properties"
      - name: Compila Forge
        run: |
          cd "$PROJECT_DIR"
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/noctis-gradle-$attempt.log"
            set +e
            bash gradlew --no-daemon build --stacktrace 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 3 ] || ! grep -Eiq 'status code (429|502|503|504)|Too Many Requests|Read timed out|Connection reset' "$log"; then
              exit "$rc"
            fi
            echo "Temporary dependency download failure; retry $attempt/3"
            sleep "$((attempt * 60))"
          done
      - name: Verifica musica nel JAR
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          root=pathlib.Path(os.environ["PROJECT_DIR"])
          target="assets/noctismagic/sounds/fallen_angel_theme.ogg"
          source=(root/"src/main/resources"/target).read_bytes()
          jars=list((root/"build/libs").glob("*.jar"))
          assert jars, "Nessun JAR generato"
          assert any(target in z.namelist() and z.read(target)==source for p in jars for z in [zipfile.ZipFile(p)]), "Musica assente dal JAR"
          print("Musica del boss verificata nel JAR")
          voice="assets/noctismagic/sounds/papi_shout.ogg"
          original=(root/"src/main/resources"/voice).read_bytes()
          assert original.startswith(b"OggS"), "Voce Papi non valida"
          assert any(voice in z.namelist() and z.read(voice)==original for p in jars for z in [zipfile.ZipFile(p)]), "Voce Papi assente dal JAR"
          print("Voce originale Papi verificata nel JAR")
          PY
      - name: Controllo statico sicurezza e inventario JAR
        run: |
          python3 - <<'PY'
          import os, pathlib, re, zipfile, hashlib
          root=pathlib.Path(os.environ["PROJECT_DIR"])
          sources=list((root/"src/main/java").rglob("*.java"))
          rules={
            "process execution":r'\b(?:ProcessBuilder|Runtime\s*\.\s*getRuntime)\b',
            "network access":r'\b(?:java\.net|javax\.net|HttpClient|URLConnection|SocketChannel|ServerSocket|InetAddress)\b',
            "filesystem access":r'\b(?:java\.io\.(?:File|FileInputStream|FileOutputStream)|java\.nio\.file|RandomAccessFile)\b',
            "native or dynamic code":r'\b(?:System\s*\.\s*load(?:Library)?|defineClass|URLClassLoader|Unsafe)\b',
            "environment access":r'\bSystem\s*\.\s*(?:getenv|getProperties|getProperty)\s*\(',
          }
          findings=[]
          for p in sources:
            for num,line in enumerate(p.read_text(encoding="utf-8",errors="replace").splitlines(),1):
              for label,pattern in rules.items():
                if re.search(pattern,line):
                  findings.append((str(p.relative_to(root)),num,label,line.strip()[:220]))
          print("Java sources inspected:",len(sources))
          for f in findings: print("REVIEW:",*f)
          print("Source indicators:",len(findings))
          for p in [root/"build.gradle",root/"settings.gradle",root/"gradle/wrapper/gradle-wrapper.properties"]:
            if p.exists():
              for line in p.read_text(encoding="utf-8",errors="replace").splitlines():
                if re.search(r'https?\\?:|dependencies|classpath|implementation|distributionUrl',line,re.I):
                  print("Build dependency/config:",p.name,line.strip()[:220])
          for p in sorted((root/"build/libs").glob("*.jar")):
            print("SHA256:",hashlib.sha256(p.read_bytes()).hexdigest(),p.name)
            with zipfile.ZipFile(p) as z:
              names=z.namelist()
              classes=[n for n in names if n.endswith(".class")]
              print("JAR entries:",len(names),"classes:",len(classes))
              suspicious=[n for n in names if n.lower().endswith((".exe",".dll",".so",".dylib",".bat",".cmd",".ps1",".sh",".jar"))]
              print("Embedded executables/archives:",suspicious)
              signatures=[b"java/lang/ProcessBuilder",b"java/lang/Runtime",b"java/net/Socket",b"java/net/URL",b"java/net/http/HttpClient",b"java/nio/file/Files",b"java/io/FileOutputStream",b"java/net/URLClassLoader"]
              bytecode_hits=[]
              for n in classes:
                b=z.read(n)
                for sig in signatures:
                  if sig in b: bytecode_hits.append((n,sig.decode()))
              for hit in bytecode_hits: print("BYTECODE REVIEW:",*hit)
              print("Bytecode indicators:",len(bytecode_hits))
          print("Heuristic review only; not an antivirus certification.")
          PY
      - name: Carica JAR
        uses: actions/upload-artifact@v4
        with:
          name: NoctisMagic-1.7.48
          path: progetto/**/build/libs/*.jar
          if-no-files-found: error
