    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit indipendente degli script del repository
        run: python3 security_audit.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache dipendenze Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-java17-forge-deps-${{ hashFiles('*.zip', 'upgrade_166.py') }}
      - name: Prepara convertitore audio
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Prepara voce italiana
        run: |
          if ! command -v espeak-ng >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y espeak-ng
          fi
      - name: Estrai progetto
        run: |
          unzip -t 'NoctisMagic-0.2.0-progetto-compilazione(1).zip'
          unzip -q 'NoctisMagic-0.2.0-progetto-compilazione(1).zip' -d progetto
          wrapper=$(find progetto -name gradlew -type f -print -quit)
          test -n "$wrapper"
          echo "PROJECT_DIR=$(dirname "$wrapper")" >> "$GITHUB_ENV"
